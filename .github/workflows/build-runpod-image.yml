name: build-runpod-image

on:
  push:
    branches: [docker-image]
    tags: ["runpod-v*"]

permissions:
  contents: read

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check deployment scope and host-safe behavior
        run: |
          python3 scripts/runpod/check_branch.py
          python3 -m unittest discover -s scripts/runpod/tests -v
          bash -n runpod-image/start.sh scripts/runpod/bootstrap.sh scripts/runpod/init_volume.sh

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/runpod-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Resolve release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/docker-image
          if [[ ! "$RELEASE_TAG" =~ ^runpod-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Use a versioned release tag such as runpod-v1.2.0" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/v2d-runpod:${BASH_REMATCH[1]}"
          main_revision=$(git merge-base HEAD origin/main)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "main_revision=$main_revision" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          large-packages: true
          docker-images: true

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build CARI4D base image
        run: |
          docker build \
            --platform linux/amd64 \
            -f reconstruction/modules/v2d_cari4d/docker/Dockerfile \
            -t cari4d-base:local \
            reconstruction/modules

      - name: Build Runpod image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          MAIN_REVISION: ${{ steps.release.outputs.main_revision }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f runpod-image/Dockerfile \
            --build-arg BASE_IMAGE=cari4d-base:local \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.v2d.main-revision=$MAIN_REVISION" \
            -t "$IMAGE" \
            .

      - name: Push
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker push "$IMAGE"
          {
            echo "### Published image"
            echo "$IMAGE"
            docker image inspect "$IMAGE" --format '{{json .RepoDigests}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage
        if: always()
        run: df -h
