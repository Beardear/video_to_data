name: build-runpod-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (bump each rebuild)"
        required: true
        default: "v1.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          large-packages: true
          docker-images: true

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build CARI4D base image
        run: |
          docker build \
            -f reconstruction/modules/v2d_cari4d/docker/Dockerfile \
            -t cari4d-base:local \
            reconstruction/modules

      - name: Build Runpod image
        run: |
          docker build \
            -f runpod-image/Dockerfile \
            --build-arg BASE_IMAGE=cari4d-base:local \
            -t ghcr.io/melanieww/v2d-runpod:${{ inputs.tag }} \
            .

      - name: Push
        run: docker push ghcr.io/melanieww/v2d-runpod:${{ inputs.tag }}

      - name: Disk usage
        if: always()
        run: df -h
